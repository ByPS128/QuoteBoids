  <polygon points="172,232 120,206 124,252" fill="#E0B400"/>
  <!-- nesené písmeno -->
  <line x1="244" y1="286" x2="238" y2="320" stroke="#E0B400" stroke-width="7"/>
  <line x1="272" y1="286" x2="278" y2="320" stroke="#E0B400" stroke-width="7"/>
  <text x="258" y="396" font-family="Georgia, serif" font-size="110" fill="#F1F5F9"
